<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Control Systems I</title>
<meta name="description" content="Control Systems I — explore the exercise room and the lecture hall. Topics, materials, office hours and recaps.">
<!-- Keeps the page out of search results while the content is still placeholder.
     Delete this line when the real information is in. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
<link rel="stylesheet" href="rooms.css">
</head>
<body>

<header class="bar">
  <nav class="rooms-nav" id="roomsNav" aria-label="Rooms"></nav>
  <p class="bar-title">Control Systems I</p>
  <p class="bar-right" id="barRight">Week 4</p>
</header>

<main class="stage" id="stage">
  <div class="canvas" id="canvas">
    <img class="shot" id="shotA" alt="">
    <img class="shot" id="shotB" alt="">
    <div class="dots" id="dots"></div>
  </div>
  <div class="missing" id="missing" hidden>
    <p class="missing-title">Photo not found</p>
    <p class="missing-path" id="missingPath"></p>
    <p class="missing-help">Save the room photo at this path and reload.</p>
  </div>
  <p class="hint" id="hint" hidden>Drag to look around the room</p>
  <div class="veil" aria-hidden="true"></div>

  <button class="arrow prev" id="prev" type="button" aria-label="Previous room">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
  </button>
  <button class="arrow next" id="next" type="button" aria-label="Next room">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>
  </button>

  <div class="caption">
    <p class="caption-name" id="capName"></p>
    <p class="caption-sub" id="capSub"></p>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">
    <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3 L11 11 M11 3 L3 11"/></svg>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<div class="editbar" id="editbar" hidden>
  <span>Edit mode — drag a dot, or click the photo for coordinates</span>
  <output id="editOut">—</output>
  <button type="button" id="copyBtn">Copy positions</button>
</div>

<script src="rooms-data.js"></script>
<script src="rooms.js"></script>
</body>
</html>
